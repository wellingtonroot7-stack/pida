name: Gerar APK Flet Atualizado
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          pip install flet-cli
          pip install openpyxl

      - name: Compilar APK via Web
        run: flet build apk --no-android-sdk
